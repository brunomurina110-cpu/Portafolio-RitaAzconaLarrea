<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería de arte de Rita Azcona.">
    <title>Mi Galería | Rita Azcona Larrea</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header / Nav -->
    <header id="header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">Rita Azcona Larrea</a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="index.html#sobre-mi">Sobre Mí</a>
                <a href="galeria.html" class="active">Mi Galería</a>
                <a href="#contacto">Contacto</a>
            </nav>
            <div class="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Galería Completa (Masonry style dinamica) -->
    <section class="gallery-section" style="padding-top: 120px; min-height: 80vh;">
        <div class="container">
            <h1 class="section-title">Mi Galería</h1>
            <!-- Filtros de Galería -->
            <div id="gallery-filters" class="gallery-filters"></div>
            
            <!-- Aquí se inyectarán dinámicamente las obras desde data.js -->
            <div class="masonry-grid" id="dynamic-gallery">
            </div>
        </div>
    </section>

    <!-- Contacto / Footer -->
    <footer id="contacto">
        <div class="container footer-wrapper">
            <div class="footer-info">
                <h2 class="logo-footer">Rita Azcona Larrea</h2>
            </div>
            <div class="footer-contact">
                <h3>Contacto</h3>
                <div class="contact-details">
                    <p class="contact-item">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <span>+54 9 11 6187-2365</span>
                    </p>
                    <p class="contact-item">
                        <a href="https://instagram.com/rm.azconalarreaart" target="_blank" class="contact-link">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                            <span>@rm.azconalarreaart</span>
                        </a>
                    </p>
                    <p class="contact-item">
                        <a href="mailto:razconalarrea@gmail.com" class="contact-link">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            <span>razconalarrea@gmail.com</span>
                        </a>
                    </p>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2026 Rita Azcona Larrea. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal / Visor Inmersivo -->
    <div id="lightbox" class="modal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()" aria-label="Cerrar">&times;</button>
            <div class="modal-layout">
                <div class="modal-image-container">
                    <img id="modal-image" src="" alt="Obra">
                </div>
                <div class="modal-details">
                    <h3 id="modal-title">Título</h3>
                    <p id="modal-specs" class="modal-specs">Técnica</p>
                    <p id="modal-price" class="modal-price">Precio</p>
                    <a id="modal-whatsapp" href="#" target="_blank" class="btn btn-primary whatsapp-btn">
                        Consultar por esta obra en WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js?v=2"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
